<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipies By Cee</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&family=Sacramento&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#2b2523;--mut:#8a7f78;--or:#e5532d;--line:#eadfd3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1917;--card:#27211f;--ink:#f4ece4;--mut:#a89c93;--line:#3a312d}}
:root[data-theme="dark"]{--bg:#1d1917;--card:#27211f;--ink:#f4ece4;--mut:#a89c93;--line:#3a312d}
*{box-sizing:inherit}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;min-height:100%}
.check{height:22px;background:repeating-conic-gradient(var(--or) 0 25%,transparent 0 50%) 0 0/22px 22px}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 60px}
header{padding:36px 0 22px;text-align:center;position:relative}
.hb{position:absolute;top:12px;padding:6px 12px;font-size:13px}
#menuBtn{right:0}
dialog{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:22px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{font:400 32px/1 Anton,Impact,sans-serif;text-transform:uppercase;margin:0 0 4px;text-shadow:2px 2px 0 var(--or)}
h1{font:400 clamp(60px,16vw,104px)/1.05 Sacramento,"Brush Script MT",cursive;text-transform:none;margin:0;color:var(--ink);text-shadow:2px 2px 0 var(--or)}:root[data-theme="dark"] h1{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1{color:#fff}}
.sub{color:var(--mut);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:14px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus{outline:none;border-color:var(--or)}
button{font:400 15px Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em;background:var(--or);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--mut);border:2px solid var(--line)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.tag{font:600 12px Inter;background:transparent;color:var(--mut);border:2px solid var(--line);border-radius:99px;padding:4px 12px;text-transform:none;letter-spacing:0}
.tag.on{border-color:var(--or);color:var(--or)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;position:relative}
.card .ph{height:130px;background:var(--line) center/cover}
.card .in{padding:14px 16px 16px}
.card:not(.hasph) .in:before{content:"";display:block;height:8px;margin:-14px -16px 12px;background:repeating-conic-gradient(var(--or) 0 25%,transparent 0 50%) 0 0/8px 8px}
.card h3{font:400 24px/1.1 Anton,Impact,sans-serif;text-transform:uppercase;margin:0 0 6px}
.star{position:absolute;top:8px;right:8px;background:var(--card);color:var(--or);border-radius:99px;padding:2px 9px;font:400 18px/1.3 Inter}
.meta{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:50px 0}
.hide{display:none!important}
.view h2,.sec h2{font:400 40px/1 Anton,Impact,sans-serif;text-transform:uppercase;margin:6px 0;text-shadow:2px 2px 0 var(--or)}
.view h4{font:400 16px Anton,Impact,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--or);margin:26px 0 8px}
.view ul,.view ol{padding-left:22px;margin:0}.view li{margin:6px 0}
.hero{height:220px;border-radius:14px;background:var(--line) center/cover;margin:14px 0}
.row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:10px;margin-top:12px}.step b{min-width:90px;text-align:center}
.step button{padding:4px 14px}
label{display:block;font:600 12px Inter;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;margin:14px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tr{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--line)}
.tr div{flex:1}.tr button{padding:5px 12px;font-size:13px}
.shopi{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.shopi input{width:20px;height:20px}.shopi.d span{text-decoration:line-through;color:var(--mut)}
#cook{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;text-align:center}
#cook p{font:400 clamp(26px,6vw,44px)/1.25 Anton,Impact,sans-serif;text-transform:uppercase;max-width:700px}
.note{font-size:13px;color:var(--mut);text-align:center;margin-top:30px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="check"></div>
<div class="wrap">
  <header><button class="ghost hb" id="menuBtn" aria-label="Open menu">Menu</button><h1>Recipies By Cee</h1><div class="sub">Made with love &middot; Est. 2026</div></header>

<section id="list">
  <div class="tags" id="tags"></div>
  <div class="grid" id="grid"></div>
  <div class="empty hide" id="empty"></div>
</section>
<section id="view" class="view hide"></section>
<section id="shop" class="sec hide"></section>

<section id="admin" class="sec hide">
  <h2>Admin</h2><div class="meta" id="stats"></div>
  <div class="row"><button id="newBtn">+ New recipe</button><button class="ghost" id="aback">← Back</button></div>
  <div id="atable" style="margin-top:14px"></div>
</section>

<section id="form" class="sec hide">
  <h2 id="formTitle">New recipe</h2>
  <label>Name</label><input id="fName">
  <div class="two"><div><label>Category</label><input id="fCat" placeholder="Dinner, Dessert…"></div><div><label>Time</label><input id="fTime" placeholder="30 min"></div><div><label>Serves</label><input id="fServ" type="number" min="1" placeholder="4"></div></div>
  <label>Photo</label><input id="fPhoto" type="file" accept="image/*"><div class="hero hide" id="pprev"></div><button class="ghost hide" id="rmPhoto" style="margin-top:8px">Remove photo</button>
  <label>Ingredients (one per line, e.g. “2 cups flour”)</label><textarea id="fIng" rows="7"></textarea>
  <label>Steps (one per line)</label><textarea id="fSteps" rows="8"></textarea>
  <label>Notes (optional)</label><textarea id="fNotes" rows="3"></textarea>
  <div class="row"><button id="save">Save</button><button class="ghost" id="cancel">Cancel</button></div>
</section>
<div class="note" id="note"></div>
</div>
<dialog id="menu">
  <h2>Menu</h2>
  <label>Search</label>
  <input id="q" placeholder="Search by name or ingredient…">
  <label>Options</label>
  <div class="row" style="margin-top:0">
    <button class="ghost" id="adminBtn">⚙ Admin</button>
    <button class="ghost" id="theme" aria-label="Toggle light and dark mode"></button>
  </div>
  <div class="row"><button id="mclose">Done</button></div>
</dialog>
<div id="cook" class="hide"><div class="meta" id="cn"></div><p id="ct"></p><div class="row"><button class="ghost" id="cp">← Prev</button><button id="cx">Next →</button><button class="ghost" id="cc">Close</button></div></div>
<div class="check" style="margin-top:20px"></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
function ls(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var recipes=[],isAdmin=false,db=null,assets=null,editing=null,tag="",favOnly=false,favs=ls("favs",[]),shop=ls("shop",[]),photo="",R=null,serv=0,ci=0,lock=null;
var V=["list","view","form","admin","shop"];
var dlg=$("menu");
$("menuBtn").onclick=function(){dlg.showModal()};
$("mclose").onclick=function(){dlg.close()};
dlg.onclick=function(e){if(e.target===dlg)dlg.close()};
$("q").onkeydown=function(e){if(e.key==="Enter"){dlg.close();renderList();show("list")}};
function show(id){V.forEach(function(s){$(s).classList.toggle("hide",s!==id)});window.scrollTo(0,0)}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function lines(s){return (s||"").split("\n").map(function(x){return x.trim()}).filter(Boolean)}
function num(s){var m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);if(m)return +m[1]+m[2]/m[3];m=s.match(/^(\d+)\/(\d+)$/);if(m)return m[1]/m[2];return parseFloat(s)}
function scale(l,f){if(f===1)return l;var m=l.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)(.*)$/);return m?String(Math.round(num(m[1])*f*100)/100)+m[2]:l}
function byId(id){return recipes.filter(function(x){return x.id===id})[0]}
function ph(r){return r.photo?'<div class="ph" style="background-image:url(&quot;'+esc(r.photo)+'&quot;)"></div>':""}

function renderList(){
  var q=$("q").value.toLowerCase(),cats=[];
  recipes.forEach(function(r){if(r.category&&cats.indexOf(r.category)<0)cats.push(r.category)});
  var t='<button class="tag'+(!tag&&!favOnly?" on":"")+'" data-t="">All</button>'+cats.map(function(c){return '<button class="tag'+(tag===c?" on":"")+'" data-t="'+esc(c)+'">'+esc(c)+'</button>'}).join("");
  t+='<button class="tag'+(favOnly?" on":"")+'" data-a="fav">♥ Favourites</button><button class="tag" data-a="rand">🎲 Surprise me</button><button class="tag" data-a="shop">🛒 List ('+shop.length+')</button>';
  $("tags").innerHTML=t;
  var f=recipes.filter(function(r){return (!tag||r.category===tag)&&(!favOnly||favs.indexOf(r.id)>-1)&&(!q||(r.name+" "+(r.ingredients||[]).join(" ")).toLowerCase().indexOf(q)>-1)});
  $("grid").innerHTML=f.map(function(r){return '<div class="card'+(r.photo?" hasph":"")+'" data-id="'+esc(r.id)+'">'+ph(r)+(favs.indexOf(r.id)>-1?'<span class="star">♥</span>':"")+'<div class="in"><h3>'+esc(r.name)+'</h3><div class="meta">'+esc([r.category,r.time].filter(Boolean).join(" · "))+'</div></div></div>'}).join("");
  $("empty").classList.toggle("hide",f.length>0);
  $("empty").textContent=recipes.length?"Nothing matches.":(isAdmin?"No recipes yet — open Admin to add one.":"No recipes yet.");
}
function renderView(){
  var r=R,fac=r.servings?serv/r.servings:1,fv=favs.indexOf(r.id)>-1;
  $("view").innerHTML='<button class="ghost" data-a="back">← Back</button>'+(r.photo?'<div class="hero" style="background-image:url(&quot;'+esc(r.photo)+'&quot;)"></div>':"")+'<h2>'+esc(r.name)+'</h2><div class="meta">'+esc([r.category,r.time].filter(Boolean).join(" · "))+'</div>'
   +(r.servings?'<div class="step"><button class="ghost" data-a="minus">−</button><b>Serves '+serv+'</b><button class="ghost" data-a="plus">+</button></div>':"")
   +'<div class="row"><button data-a="cook">▶ Cook mode</button><button class="ghost" data-a="fav">'+(fv?"♥ Saved":"♡ Save")+'</button><button class="ghost" data-a="addshop">+ Shopping list</button></div>'
   +'<h4>Ingredients</h4><ul>'+(r.ingredients||[]).map(function(x){return '<li>'+esc(scale(x,fac))+'</li>'}).join("")+'</ul>'
   +'<h4>Steps</h4><ol>'+(r.steps||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ol>'
   +(r.notes?'<h4>Notes</h4><p>'+esc(r.notes)+'</p>':"")
   +(isAdmin?'<div class="row"><button data-a="edit">Edit</button><button class="ghost" data-a="del">Delete</button></div>':"");
}
function open(r){R=r;serv=r.servings||0;renderView();show("view")}
function renderShop(){
  $("shop").innerHTML='<button class="ghost" data-a="back">← Back</button><h2>Shopping list</h2>'+(shop.length?shop.map(function(s,i){return '<label class="shopi'+(s.d?" d":"")+'" style="text-transform:none;letter-spacing:0;font:400 16px Inter;color:var(--ink);margin:0"><input type="checkbox" data-i="'+i+'"'+(s.d?" checked":"")+'><span>'+esc(s.t)+'</span></label>'}).join("")+'<div class="row"><button class="ghost" data-a="clrdone">Clear ticked</button><button class="ghost" data-a="clrall">Clear all</button></div>':'<div class="empty">Your list is empty. Add ingredients from any recipe.</div>');
  show("shop");
}
$("shop").onclick=function(e){var b=e.target.closest("[data-a]"),c=e.target.closest("input[data-i]");
  if(c){shop[+c.getAttribute("data-i")].d=c.checked;sv("shop",shop);renderShop();return}
  if(!b)return;var a=b.getAttribute("data-a");
  if(a==="back"){renderList();show("list")}
  if(a==="clrdone"){shop=shop.filter(function(s){return !s.d})}
  if(a==="clrall"){shop=[]}
  if(a==="clrdone"||a==="clrall"){sv("shop",shop);renderShop()}};
$("view").onclick=function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a");
  if(a==="back"){renderList();show("list")}
  if(a==="minus"&&serv>1){serv--;renderView()}
  if(a==="plus"){serv++;renderView()}
  if(a==="fav"){var i=favs.indexOf(R.id);if(i>-1)favs.splice(i,1);else favs.push(R.id);sv("favs",favs);renderView()}
  if(a==="addshop"){var f=R.servings?serv/R.servings:1;(R.ingredients||[]).forEach(function(x){shop.push({t:scale(x,f),d:false})});sv("shop",shop);b.textContent="✓ Added"}
  if(a==="cook"){ci=0;$("cook").classList.remove("hide");cookR();try{navigator.wakeLock.request("screen").then(function(l){lock=l}).catch(function(){})}catch(x){}}
  if(a==="edit")openForm(R);
  if(a==="del"&&confirm("Delete this recipe?"))api("DELETE","/api/recipes/"+R.id).then(load).then(function(){renderList();show("list")}).catch(function(){alert("Couldn’t delete.")})};
function cookR(){var s=R.steps||[];$("cn").textContent="Step "+(ci+1)+" of "+s.length;$("ct").textContent=s[ci]||"No steps yet.";$("cp").classList.toggle("hide",ci===0);$("cx").textContent=ci>=s.length-1?"Done ✓":"Next →"}
$("cp").onclick=function(){ci--;cookR()};
$("cx").onclick=function(){if(ci>=(R.steps||[]).length-1)$("cc").onclick();else{ci++;cookR()}};
$("cc").onclick=function(){$("cook").classList.add("hide");try{lock&&lock.release()}catch(x){}};

$("tags").onclick=function(e){var b=e.target.closest("button");if(!b)return;var a=b.getAttribute("data-a");
  if(a==="fav")favOnly=!favOnly;
  else if(a==="rand"){if(recipes.length)open(recipes[Math.floor(Math.random()*recipes.length)]);return}
  else if(a==="shop"){renderShop();return}
  else{tag=b.getAttribute("data-t");favOnly=false}
  renderList()};
$("q").oninput=renderList;
$("grid").onclick=function(e){var c=e.target.closest(".card");if(c){var r=byId(c.getAttribute("data-id"));if(r)open(r)}};

function renderAdmin(){
  $("stats").textContent=recipes.length+" recipe"+(recipes.length===1?"":"s");
  $("atable").innerHTML=recipes.map(function(r){return '<div class="tr"><div><b>'+esc(r.name)+'</b><div class="meta">'+esc(r.category||"")+'</div></div><button data-e="'+esc(r.id)+'">Edit</button><button class="ghost" data-d="'+esc(r.id)+'">Delete</button></div>'}).join("")||'<div class="empty">No recipes yet.</div>';
}
$("adminBtn").onclick=function(){dlg.close();if(isAdmin){renderAdmin();show("admin");return}
  var p=prompt("Admin password");if(p)api("POST","/api/login",{password:p}).then(function(){isAdmin=true;renderList();renderAdmin();show("admin")}).catch(function(){alert("Wrong password.")})};
$("aback").onclick=function(){show("list")};
$("newBtn").onclick=function(){openForm(null)};
$("atable").onclick=function(e){var b=e.target.closest("button");if(!b)return;
  if(b.getAttribute("data-e"))openForm(byId(b.getAttribute("data-e")));
  if(b.getAttribute("data-d")&&confirm("Delete this recipe?"))api("DELETE","/api/recipes/"+b.getAttribute("data-d")).then(load).catch(function(){alert("Couldn’t delete.")})};

function setPhoto(u){photo=u||"";$("pprev").classList.toggle("hide",!photo);$("rmPhoto").classList.toggle("hide",!photo);if(photo)$("pprev").style.backgroundImage='url("'+photo+'")'}
function openForm(r){
  editing=r||null;$("formTitle").textContent=r?"Edit recipe":"New recipe";
  $("fName").value=r?r.name:"";$("fCat").value=r&&r.category||"";$("fTime").value=r&&r.time||"";$("fServ").value=r&&r.servings||"";
  $("fIng").value=r?(r.ingredients||[]).join("\n"):"";$("fSteps").value=r?(r.steps||[]).join("\n"):"";$("fNotes").value=r&&r.notes||"";
  $("fPhoto").value="";setPhoto(r&&r.photo);show("form")}
$("fPhoto").onchange=function(){var f=this.files[0];if(!f)return;$("save").disabled=true;
  fetch("/api/upload",{method:"POST",headers:{"Content-Type":f.type},body:f}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(a){setPhoto(a.url)}).catch(function(){alert("Photo upload failed.")}).then(function(){$("save").disabled=false})};
$("rmPhoto").onclick=function(){setPhoto("")};
$("cancel").onclick=function(){show(editing?"admin":"list");if(editing)renderAdmin()};
$("save").onclick=function(){
  var name=$("fName").value.trim();if(!name){alert("Add a name first.");return}
  var d={name:name,category:$("fCat").value.trim(),time:$("fTime").value.trim(),servings:parseInt($("fServ").value,10)||0,photo:photo,ingredients:lines($("fIng").value),steps:lines($("fSteps").value),notes:$("fNotes").value.trim(),updated:Date.now()};
  var p=editing?api("PUT","/api/recipes/"+editing.id,d):api("POST","/api/recipes",d);
  p.then(load).then(function(){renderAdmin();show("admin")}).catch(function(){alert("Couldn’t save. Make sure you have edit access.")})};

var root=document.documentElement,mq=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)");
function cur(){return root.getAttribute("data-theme")||(mq&&mq.matches?"dark":"light")}
function label(){$("theme").textContent=cur()==="dark"?"☀ Light":"☾ Dark"}
try{var st=localStorage.getItem("theme");if(st)root.setAttribute("data-theme",st)}catch(e){}
label();
$("theme").onclick=function(){var n=cur()==="dark"?"light":"dark";root.setAttribute("data-theme",n);try{localStorage.setItem("theme",n)}catch(e){}label()};

function api(m,u,b){return fetch(u,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function load(){return api("GET","/api/recipes").then(function(x){recipes=x.sort(function(a,b){return (a.name||"").localeCompare(b.name||"")});renderList();if(!$("admin").classList.contains("hide"))renderAdmin()})}
function start(){api("GET","/api/me").then(function(m){isAdmin=m.admin;return load()}).catch(function(){$("note").textContent="Couldn’t reach the server."})}
renderList();start();
})();
</script>
</body>
</html>
